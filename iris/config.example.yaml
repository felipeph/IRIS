general:
  default_source: G:\DCIM
  destination_root: C:\IRIS
  last_project: 2026-09-20_19-25_DCIM
  log_level: INFO
  theme: dark
naming:
  photo_pattern: "{date}_{time}_{camera}_{resolution}_{dimensions}_{focal}_{aperture}_{shutter}_{iso}_{original}.{ext}"
  video_pattern: "{date}_{time}_{camera}_{resolution}_{dimensions}_{fps}_{duration}_{original}.{ext}"
classification:
  moon_zoom_threshold_mm: 1000.0
  recognize_timelapse_folders: true       # Reconhece pastas pré-organizadas com 'timelapse' no nome
  timelapse_min_photos: 200               # Quantidade mínima de fotos para formar timelapse (heurística geral)
  timelapse_min_photos_folder: 30         # Quantidade mínima de fotos em pastas dedicadas a timelapse
  timelapse_max_interval_seconds: 60.0    # Teto base para fotos gerais/diurnas
  timelapse_tolerance_ratio: 0.25         # Tolerância de cadência (ex: 0.25 = ±25%)
  enable_burst_detection: true
  burst_interval_seconds: 1.5
  enable_timelapse_album_samples: true
  timelapse_sample_interval_minutes: 5.0
  timelapse_normal:
    min_photos: 200                       # Mínimo de fotos para timelapse convencional (diurno / intervalos curtos)
    min_interval_seconds: 0.3             # Intervalo mínimo aceitável (evita rajadas contínuas)
    max_interval_seconds: 60.0            # Intervalo máximo tolerado entre fotos
    tolerance_ratio: 0.25                 # Tolerância de cadência relativa (±25%)
    tolerance_min_seconds: 0.5            # Piso de tolerância absoluta em segundos
    stall_factor_max: 4.0                 # Teto de atraso isolado por buffer da câmera (ex: até 4x a cadência)
    max_stall_fraction: 0.05              # Máximo de 5% de fotos com atraso isolado no segmento
    min_regular_fraction: 0.90            # Pelo menos 90% das fotos estritamente na cadência
  timelapse_long_exposure:
    enabled: true                         # Ativa perfil dedicado para astrofotografia / longa exposição
    folder: "4_Timelapses_LongaExposicao" # Pasta de destino isolada
    min_shutter_seconds: 5.0              # Disparos com obturador >= 5s ativam este perfil
    min_photos: 60                        # Mínimo de fotos para timelapse de longa exposição
    max_interval_seconds: 180.0           # Intervalo máximo permitido entre disparos
    tolerance_ratio: 0.15                 # Tolerância de cadência relativa (±15%)
    tolerance_min_seconds: 3.0            # Piso de tolerância absoluta
    stall_factor_max: 5.0                 # Teto de atraso isolado ou frame pulado (até 5x a cadência)
    max_stall_fraction: 0.15              # Até 15% de atrasos isolados / gaps tolerados
    min_regular_fraction: 0.85            # Pelo menos 85% dos disparos na cadência
  astro_timelapse:
    min_shutter_seconds: 5.0              # Compatibilidade retroativa
    max_interval_seconds: 180.0
    max_gap_seconds: 600.0
modules:
  astro_stack:
    enabled: true
    keep_percents: [50]               # Percentuais de frames por ponto de alinhamento
    margin_pixels: 128                # Margem além do diâmetro lunar em pixels
    align_box_width: 64               # Caixa de ponto de alinhamento (pixels)
    align_search_width: 20            # Raio de busca do alinhamento (pixels)
    stab_mode: "Surface"              # "Surface" para superfície lunar
    timeout_seconds: 600              # Timeout do PSS
    venv_path: "auto"                 # "auto" ou caminho do executável/venv
    windows_toast: true
    ntfy_topic: "iris-alerts"
  astro_sharpen:
    enabled: true
    presets: ["registax_fiel", "registax_clean", "registax_iluminado", "registax_pro"]
    enable_clahe: true                # Realce adaptativo de contraste local 16-bit
    use_limb_guard: true              # Proteção anti-halo/ringing no limbo lunar
    windows_toast: true
  bird_id:
    enabled: true
    classifier_type: "inaturalist"       # Provedor taxonômico: 'inaturalist' (API recomendada) ou 'bioclip' (local zero-shot)
    yolo_model: "yolov8s.pt"
    yolo_confidence: 0.25
    min_species_confidence: 0.70          # Limiar de alta certeza para renomeação, subpasta e tags EXIF
    rename_files: true                   # Renomeação com {stem}_{Nome_PT}_{Nome_Cientifico} (apenas sublinhados, sem colchetes)
    organize_in_subfolders: true         # Organiza em subpasta com nome popular da ave dentro da categoria
    write_exif_tags: true                # Injeta palavras-chave IPTC/EXIF/XMP via ExifTool
    video_target_frames: 15              # Alvo de frames amostrados proporcionalmente à duração do vídeo
    video_max_crops: 5                   # Quantidade de recortes mais nítidos enviados para votação ponderada
    video_min_confident_crops: 2         # Mínimo de recortes nítidos da mesma espécie para validar o vídeo
    zoom_threshold_mm: 300.0             # Distância focal equivalente mínima para filtrar teleobjetivas
    iris_crops_folder: "10_Aves/Recortes" # Pasta na raiz do destino para recortes (ex: C:\IRIS\10_Aves\Recortes\{projeto}\)
    save_crops: true                     # Salva recortes de alta resolução na pasta do IRIS
    inaturalist:
      api_url: "https://api.inaturalist.org/v2/computervision/score_image"
      credentials_file: "secrets/inaturalist.json"
      default_lat: -19.92                # Latitude padrão para fotos sem GPS (prior geográfico regional)
      default_lng: -43.94                # Longitude padrão para fotos sem GPS
      positional_accuracy_meters: 25000  # Raio de confiança/precisão geográfica em metros (ex: 25km)
      request_delay_seconds: 1.0         # Intervalo entre requisições para rate-limiting seguro
      use_exif_gps: true                 # Extrai GPS nativo do EXIF da foto quando disponível
  cleanup:
    auto_clean: true
    allow_permanent_sd_clean: false   # Permite exclusão permanente no SD se Lixeira não for suportada (default: false - Zero Data Loss)
  dedup:
    enabled: true
  ingestion:
    strategy: "move"          # "move" (rápido nativo) ou "copy" (cópia clássica segura)
    max_workers: 4            # número de threads para movimentação paralela
  timelapse:
    enabled: true
    render_profile: fast            # Perfis: 'fast' (Intel QSV HW / Corte 1:1 Sensor), 'balanced' (Bicúbico), 'quality' (Lanczos/Deband)
    fps: 60
    frames_per_image: 1
    target_width: 3840
    target_height: 2160
    crop_mode: "bottom"             # 'bottom' (Base), 'center' (Centro), 'top' (Topo) ou 'full' (Quadro completo 100% com barras laterais)
    crf: 15
    preset: "ultrafast"
    downscale_mode: "scale"
    test_sample_size: 120
    auto_clean_sequence: true
    deband:
      enabled: true             # Suaviza faixas de cor em gradientes (céu) no FFmpeg
      add_grain: true           # Adiciona micro-grão sutil para evitar recompressão do YouTube
    ntfy_topic: "timelapse-studio-2026"
    windows_toast: true
  timelapse_long_exposure:
    enabled: true               # Habilita renderização de timelapses de longa exposição
    render_profile: quality     # Perfil recomendado para astrofotografia: quality (Lanczos + deband 16-bit com dither)
    fps: 30                     # Taxa de quadros suave para céu noturno / estrelas
    frames_per_image: 1         # Multiplicador de quadros por foto (FPI)
    crop_mode: "center"         # Enquadramento centralizado 16:9 4K UHD
    target_width: 3840
    target_height: 2160
    crf: 15
    deband:
      enabled: true
      add_grain: true
  video_edit:
    enabled: true
    render_profile: fast            # Perfis: 'fast' (Intel QSV hardware), 'balanced' (unsharp 3x3), 'quality' (Lanczos + deband 16-bit)
    mode: "individual"              # 'individual' (upscale 1:1) ou 'joined' (junção de vídeos da mesma pasta de origem)
    speed: 1.0                      # Multiplicador de velocidade (ex: 1.0, 2.0, 0.5)
    target_fps: 60                  # Teto de FPS (ex: 30, 60)
    target_width: 3840              # 4K UHD Largura
    target_height: 2160             # 4K UHD Altura
    crf: 16
    preset: "slow"
    unsharp_filter: true
    deband_enabled: true
    trim_enabled: true
    trim_seconds: 2.0
    strip_audio: false
  youtube:
    enabled: true
    privacy_status: "unlisted"
    category_id: "22"
    playlist: "Timelapses"
    timelapse_long_exposure_playlist: "Timelapses Longa Exposição"
    secrets_dir: "secrets"
    stage_interval_seconds: 180
    ntfy_topic: "timelapse-studio-2026"
    windows_toast: true
    cleanup_local_videos: true
    cleanup_to_trash: true
    auto_cleanup_videos: false
  bird_detect:
    enabled: true
  bird_id:
    enabled: true
    classifier_type: inaturalist
    min_species_confidence: 0.70
    enable_burst_consensus: true
    burst_min_agreement_ratio: 0.50
    enable_burst_early_exit: true
    burst_early_exit_confirmations: 3
    rename_files: true
    organize_in_subfolders: true
    write_exif_tags: true
    zoom_threshold_mm: 300.0
    iris_crops_folder: "10_Aves/Recortes"
    yolo_model: "yolov8s.pt"
    yolo_confidence: 0.25
    video_target_frames: 15
    video_max_crops: 5
    video_min_confident_crops: 2
    inaturalist:
      api_url: "https://api.inaturalist.org/v2/computervision/score_image"
      credentials_file: "secrets/inaturalist.json"
      default_lat: -20.456887
      default_lng: -45.438307
      positional_accuracy_meters: 25000
      request_delay_seconds: 1.0
      use_exif_gps: true
pipeline:
  stages:
  - enabled: true
    id: ingestion
    module: src.modules.ingestion.stage
    name: Ingestão de Arquivos (SD -> SSD)
  - enabled: true
    id: cleanup
    module: src.modules.cleanup.stage
    name: Limpeza da Origem (Após verificação)
  - enabled: true
    id: sanitization
    module: src.modules.sanitization.stage
    name: Sanitização de Metadados EXIF
  - enabled: true
    id: planning
    module: src.modules.planning.stage
    name: Planejamento e Metadados (Staging)
  - enabled: true
    id: organize
    module: src.modules.organize.stage
    name: Organização Física (SSD)
  - enabled: true
    id: bird_detect
    module: src.modules.bird_id.detect_stage
    name: Detecção e Recorte de Aves (YOLOv8)
  - enabled: true
    id: bird_id
    module: src.modules.bird_id.classify_stage
    name: Identificação Taxonômica de Aves (iNaturalist)
  - enabled: true
    id: bird_organize
    module: src.modules.bird_id.organize_stage
    name: Organização Física de Aves (Subpastas e Nomes)
  - enabled: true
    id: bird_tag
    module: src.modules.bird_id.tag_stage
    name: Injeção de Metadados de Aves (EXIF/IPTC)
  - enabled: true
    id: astro_stack
    module: src.modules.astro_stack.stage
    name: Empilhamento Lunar (PSS -> 8_Astro_Stack)
  - enabled: true
    id: astro_sharpen
    module: src.modules.astro_sharpen.stage
    name: Aprimoramento Wavelets (9_Astro_Sharpening)
  - enabled: true
    id: timelapse
    module: src.modules.timelapse.stage
    name: Renderização de Timelapse 4K
  - enabled: true
    id: youtube
    module: src.modules.youtube.stage
    name: Publicação de Vídeos no YouTube

